<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Checks: Odd One Out</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: linear-gradient(180deg, #f4f0ff, #e6dff9); min-height: 100vh; margin: 0; padding: 40px 20px; display: flex; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
    .learner-wrapper { width: 100%; max-width: 1300px; position: relative; margin: 0 auto; }
    
    .ouo-app { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #2d3748; width: 100%; }
    .ouo-app * { box-sizing: border-box; } 
    .ouo-screen { opacity: 1; transform: translateY(0); transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease; display: block; text-align: center; }
    .ouo-screen.roll-out-up { transform: translateY(-50px); opacity: 0; pointer-events: none; position: absolute; width: 100%; }
    .ouo-screen.roll-in-up { animation: rollIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .ouo-hidden { display: none !important; }
    @keyframes rollIn { 0% { transform: translateY(100px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    .ouo-intro { text-align: center; margin-bottom: 40px; }
    .ouo-eyebrow { color: #6221f1; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.85rem; margin-bottom: 12px; }
    .ouo-title { font-size: 2.6rem; font-weight: 800; margin-bottom: 16px; color: #1a202c; line-height: 1.2; }
    .ouo-text { font-size: 1.15rem; color: #4a5568; max-width: 800px; margin: 0 auto; line-height: 1.6; }

    .ouo-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-bottom: 40px; width: 100%; }
    
    .ouo-card {
      box-sizing: border-box; 
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 2px solid transparent; border-radius: 20px; padding: 25px 25px 35px 25px; 
      display: flex; flex-direction: column; cursor: pointer; position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 8px 24px rgba(0,0,0,0.06); text-align: left;
    }

    .ouo-grid[data-total="3"] .ouo-card {
      flex: 0 1 calc(33.333% - 16px); min-width: 300px; max-width: 380px; min-height: 250px;
    }
    .ouo-grid[data-total="4"] .ouo-card {
      flex: 0 1 calc(25% - 18px); min-width: 220px; max-width: 300px; min-height: 250px;
    }
    .ouo-grid:not([data-total="3"]):not([data-total="4"]) .ouo-card {
      flex: 0 1 calc(33.333% - 16px); min-width: 280px; max-width: 360px; min-height: 250px;
    }

    .ouo-card:hover { transform: translateY(-8px); box-shadow: 0 16px 32px rgba(98, 33, 241, 0.15); border-color: rgba(98, 33, 241, 0.2); }
    
    .ouo-bg-clip { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 20px; z-index: 0; pointer-events: none; }
    .ouo-bg-mark { position: absolute; top: -10px; right: 10px; font-size: 7rem; font-weight: 900; color: rgba(98, 33, 241, 0.04); z-index: 0; line-height: 1; user-select: none;}
    
    .ouo-card.selected { border-color: #6221f1; box-shadow: 0 0 0 3px rgba(98,33,241,0.2), 0 16px 32px rgba(98,33,241,0.15); background: #ffffff; }
    .ouo-badge {
      position: absolute; top: -14px; right: 20px; background: #6221f1; color: white; font-weight: 700;
      font-size: 0.85rem; padding: 6px 16px; border-radius: 20px; text-transform: uppercase; opacity: 0;
      transform: translateY(10px); transition: all 0.3s ease; pointer-events: none; z-index: 5; box-shadow: 0 4px 10px rgba(98,33,241,0.3);
    }
    .ouo-card.selected .ouo-badge { opacity: 1; transform: translateY(0); }

    .ouo-card.is-correct { z-index: 10; background: #f0fff4; border-color: #38a169; box-shadow: 0 0 0 3px rgba(56,161,105,0.3), 0 20px 40px rgba(56,161,105,0.2); animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .ouo-card.is-correct .ouo-badge { background: #38a169; opacity: 1; transform: translateY(0); }
    .ouo-card.is-incorrect { z-index: 10; background: #fff5f5; border-color: #e53e3e; box-shadow: 0 0 0 3px rgba(229,62,62,0.3), 0 16px 32px rgba(229,62,62,0.15); animation: popAndShake 0.6s ease-in-out forwards; }
    .ouo-card.is-incorrect .ouo-badge { background: #e53e3e; opacity: 1; transform: translateY(0); }

    @keyframes popUp { 0% { transform: scale(1); } 100% { transform: scale(1.05) translateY(-5px); } }
    @keyframes popAndShake { 0% { transform: scale(1) translateX(0); } 20% { transform: scale(1.05) translateX(-8px); } 40% { transform: scale(1.05) translateX(8px); } 60% { transform: scale(1.05) translateX(-6px); } 80% { transform: scale(1.05) translateX(6px); } 100% { transform: scale(1.05) translateX(0); } }

    .ouo-content-wrapper { flex-grow: 1; display: flex; flex-direction: column; position: relative; z-index: 1; justify-content: flex-start; }
    
    .ouo-card-title { color: #6221f1; font-weight: 700; font-size: 1.15rem; margin-bottom: 12px; line-height: 1.3; text-align: left; }
    .ouo-card-body { color: #4a5568; font-size: 0.95rem; line-height: 1.5; margin: 0; text-align: left; }

    .ouo-action { display: flex; justify-content: center; margin-top: 20px; flex-direction: column; align-items: center; gap: 10px; }
    .ouo-btn { background: #6221f1; color: #ffffff; border: none; border-radius: 30px; padding: 16px 40px; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 14px rgba(98,33,241,0.3); }
    .ouo-btn:hover:not(:disabled) { background: #501ad9; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(98,33,241,0.4); }
    .ouo-btn:disabled { background: #cbd5e0; box-shadow: none; cursor: not-allowed; transform: none; }

    .ouo-feedback-panel { background: #ffffff; border-radius: 20px; padding: 50px; margin: 20px auto 40px auto; box-shadow: 0 8px 24px rgba(0,0,0,0.06); max-width: 900px; text-align: center; }
    .ouo-result-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 25px; }
    .ouo-correct-col { color: #38a169; } .ouo-incorrect-col { color: #e53e3e; }
    .ouo-feedback-text p { font-size: 1.15rem; line-height: 1.7; margin-bottom: 20px; color: #4a5568; text-align: left; }
    .ouo-feedback-text strong { color: #0f172a; }

    /* Styling for Dynamic Feedback Elements */
    .misconception-block { background: #f3f0ff; border-left: 4px solid #6221f1; padding: 20px; margin-top: 20px; border-radius: 0 8px 8px 0; text-align: left; }
    .misconception-title { font-weight: 800; color: #501ad9; margin-bottom: 10px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .correction-block { background: #fff5f5; border-left: 4px solid #e53e3e; padding: 20px; margin-top: 20px; border-radius: 0 8px 8px 0; text-align: left; }
    .correction-title { font-weight: 800; color: #c53030; margin-bottom: 10px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .correction-card-title { font-weight: 700; color: #1a202c; font-size: 1.1rem; margin-bottom: 6px;}

    .ouo-loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1500; flex-direction: column; justify-content: center; align-items: center; }
    .ouo-shuffle { position: relative; width: 160px; height: 100px; margin-bottom: 30px; }
    .ouo-scard { position: absolute; width: 45px; height: 70px; background: white; border: 3px solid #6221f1; border-radius: 6px; top: 15px; box-shadow: 0 4px 10px rgba(98,33,241,0.2); }
    .ouo-scard::after { content: '?'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #6221f1; font-weight: bold; font-size: 1.5rem; opacity: 0.3; }
    .ouo-c1 { animation: sLeft 1.2s infinite cubic-bezier(0.4,0,0.2,1); } .ouo-c2 { left: 57px; animation: sCenter 1.2s infinite cubic-bezier(0.4,0,0.2,1); } .ouo-c3 { animation: sRight 1.2s infinite cubic-bezier(0.4,0,0.2,1); }
    @keyframes sLeft { 0% { left: 0; z-index: 1; transform: scale(1); } 50% { left: 115px; z-index: 10; transform: scale(1.1) rotate(5deg); } 100% { left: 0; z-index: 1; transform: scale(1); } }
    @keyframes sRight { 0% { left: 115px; z-index: 2; transform: scale(1); } 50% { left: 0; z-index: 0; transform: scale(0.9) rotate(-5deg); } 100% { left: 115px; z-index: 2; transform: scale(1); } }
    @keyframes sCenter { 0% { transform: translateY(0); } 25% { transform: translateY(-15px); } 50% { transform: translateY(0); } 75% { transform: translateY(15px); } 100% { transform: translateY(0); } }
    .ouo-ltext { color: #6221f1; font-size: 1.5rem; font-weight: 700; }

    .ouo-confetti { position: fixed; top: -15px; width: 10px; height: 10px; z-index: 2000; animation: cFall linear forwards; }
    @keyframes cFall { to { transform: translateY(105vh) rotate(720deg); } }
  </style>
</head>
<body>
  <div class="learner-wrapper" id="standalone-root"></div>
  
  <script>
    const payloadData = [
      {
        "id": 1,
        "title": "Regulatory Jurisdiction",
        "instruction": "<strong style='color:#e53e3e; text-transform: uppercase;'>Odd One Out:</strong> Two of these statements are perfectly accurate. Identify the <strong>one incorrect statement</strong> that contains a critical misconception regarding regulatory authority.",
        "watermark": "number",
        "feedbackCorrect": "<p><strong>Correct! You identified the flawed statement.</strong></p><p>It is a critical misconception to believe an accreditation body is a law enforcement agency. They have zero statutory powers. Their primary enforcement leverage is entirely commercial and administrative.</p>",
        "feedbackIncorrect": "<p><strong>Incorrect. That statement is technically accurate and outlines correct regulatory boundaries.</strong></p><p>The Health and Safety Executive is a statutory regulator (breaches can lead to prosecution), and accreditation bodies evaluate compliance to maintain commercial testing status. The flawed statement incorrectly claimed accreditation bodies have direct statutory and criminal prosecution powers.</p>",
        "feedbackMisconception": "Accreditation bodies cannot fine you, shut your site down via a statutory notice, or prosecute you in a criminal court. If your lab suffers a critical quality failure, they can suspend or revoke your accreditation, legally halting your commercial operations, but this is an administrative action, not a criminal one.",
        "cards": [
          {
            "id": 101,
            "title": "Statutory Action",
            "front": "Technical assessors have the direct statutory authority to issue legal Prohibition Notices and initiate criminal prosecution against individual laboratory staff.",
            "isDistractor": true
          },
          {
            "id": 102,
            "title": "HSE Enforcement",
            "front": "The HSE acts as a statutory enforcement body that can criminally prosecute organisations or individuals for quality system failures.",
            "isDistractor": false
          },
          {
            "id": 103,
            "title": "Commercial Accreditation",
            "front": "An accreditation body evaluates a facility's compliance with standards to determine whether they can legally maintain commercial testing status.",
            "isDistractor": false
          }
        ]
      },
      {
        "id": 2,
        "title": "Structured Investigation Triggers",
        "instruction": "<strong style='color:#e53e3e; text-transform: uppercase;'>Odd One Out:</strong> Two of these statements describe true quality triggers. Identify the <strong>one incorrect statement</strong> that represents a fundamental misunderstanding of laboratory investigations.",
        "watermark": "number",
        "feedbackCorrect": "<p><strong>Correct! You identified the flawed concept.</strong></p><p>Commercial laboratories operate under strict, prescriptive testing frameworks, not academic exploratory science. An investigation is never an unguided, open-ended research project to test abstract ideas.</p>",
        "feedbackIncorrect": "<p><strong>Incorrect. That statement perfectly describes a valid trigger or mechanism for a structured quality investigation.</strong></p><p>Investigations are formal tools used to isolate analytical deviations, and an internal audit trace is required when documentation drops occur. The flawed statement incorrectly described investigations as 'open-ended research exercises'.</p>",
        "feedbackMisconception": "A laboratory investigation is a highly managed, retrospective forensic process designed exclusively to track and resolve a specific, identified data defect or non-conformance. It must have strict parameters, a root cause, and a definitive corrective action.",
        "cards": [
          {
            "id": 201,
            "title": "Open-Ended Research",
            "front": "A formal, document-controlled laboratory investigation can be launched as an open-ended research exercise to explore abstract scientific hypotheses.",
            "isDistractor": true
          },
          {
            "id": 202,
            "title": "Reactive Mechanisms",
            "front": "A structured laboratory investigation is a reactive quality mechanism triggered when an analytical deviation or OOS result occurs.",
            "isDistractor": false
          },
          {
            "id": 203,
            "title": "Internal Audit Traces",
            "front": "An investigation trace must be executed when an internal quality audit flags a data drop, such as missing daily equipment logs.",
            "isDistractor": false
          }
        ]
      },
      {
        "id": 3,
        "title": "Naming Conventions vs. Enforceability",
        "instruction": "<strong style='color:#e53e3e; text-transform: uppercase;'>Odd One Out:</strong> Two of these statements reflect true audit reality. Identify the <strong>one incorrect statement</strong> that falls for a terminology trap.",
        "watermark": "number",
        "feedbackCorrect": "<p><strong>Correct! You found the terminology trap.</strong></p><p>Organisations use varying names for document control (SOPs, Work Instructions, Lab Procedures). Auditors do not look at the title on the cover page; they look at whether the prescriptive, mandatory steps inside are strictly executed.</p>",
        "feedbackIncorrect": "<p><strong>Incorrect. That statement correctly reflects how operational compliance is managed and audited.</strong></p><p>Compliance is driven by execution, not naming conventions, and corporate policies differ fundamentally from granular technical SOPs. The flawed statement wrongly claimed that changing a document's title removes its legal enforceability.</p>",
        "feedbackMisconception": "A document does not lose its enforceability just because it is called a 'Method' instead of a 'Standard Operating Procedure'. The critical factor under audit scrutiny is always that the technical content inside is strictly adhered to in order to prevent deviations.",
        "cards": [
          {
            "id": 301,
            "title": "Title Enforceability",
            "front": "If a laboratory issues instructions under the title 'Testing Methods' rather than 'SOP', the document loses its legal enforceability during an audit.",
            "isDistractor": true
          },
          {
            "id": 302,
            "title": "Operational Adherence",
            "front": "Under audit scrutiny, the specific name applied to an instruction sheet is irrelevant; the critical factor is that the technical content is strictly adhered to.",
            "isDistractor": false
          },
          {
            "id": 303,
            "title": "Hierarchical Control",
            "front": "Corporate policies define high-level strategic goals, whereas technical SOPs dictate the exact mechanical instructions required to perform analysis.",
            "isDistractor": false
          }
        ]
      },
      {
        "id": 4,
        "title": "The Scope of SOP Standardisation",
        "instruction": "<strong style='color:#e53e3e; text-transform: uppercase;'>Odd One Out:</strong> Two of these statements correctly define SOP goals. Identify the <strong>one incorrect statement</strong> that contains a dangerous operational misconception.",
        "watermark": "number",
        "feedbackCorrect": "<p><strong>Correct! You identified the operational misconception.</strong></p><p>A technical SOP in an accredited environment is not a tool designed for commercial speed, throughput, or productivity. In fact, rushing to meet capacity quotas often introduces shortcuts that violate the SOP.</p>",
        "feedbackIncorrect": "<p><strong>Incorrect. That statement accurately defines the true quality purpose of a technical SOP.</strong></p><p>SOPs exist to remove individual human variability/bias and to ensure identical parameters yield repeatable outcomes. The flawed statement incorrectly suggested SOPs are designed primarily to boost productivity metrics and throughput.</p>",
        "feedbackMisconception": "While corporate documents might track business throughput, standardisation under quality frameworks is entirely about reproducibility and technical consistency. Standardisation protects data integrity; it does not inherently guarantee speed.",
        "cards": [
          {
            "id": 401,
            "title": "Throughput Optimisation",
            "front": "SOPs are implemented primarily to streamline laboratory throughput, boost analyst productivity metrics, and shorten onboarding timelines.",
            "isDistractor": true
          },
          {
            "id": 402,
            "title": "Eliminating Bias",
            "front": "The primary goal of a technical SOP is to standardise workflows so that individual human variability and analyst bias are completely eliminated.",
            "isDistractor": false
          },
          {
            "id": 403,
            "title": "Reproducible Outcomes",
            "front": "Adhering strictly to an SOP ensures that identical testing parameters yield the exact same repeatable outcome across repeated trials.",
            "isDistractor": false
          }
        ]
      },
      {
        "id": 5,
        "title": "Retrospective Data Modifications",
        "instruction": "<strong style='color:#e53e3e; text-transform: uppercase;'>Odd One Out:</strong> Two of these statements describe secure data rules. Identify the <strong>one incorrect statement</strong> that represents an absolute compliance violation.",
        "watermark": "number",
        "feedbackCorrect": "<p><strong>Correct! You identified a severe compliance violation.</strong></p><p>You can never simply delete, overwrite, or edit data within a LIMS to hide a deviation. Doing so completely corrupts the 'Golden Thread' of safety and will be flagged as a major non-conformance.</p>",
        "feedbackIncorrect": "<p><strong>Incorrect. That statement accurately describes secure data governance rules.</strong></p><p>Modern systems use time-stamped digital signatures, and any corrections must be transparent and formally signed off. The flawed statement described an analyst secretly overwriting raw records, which is a major compliance breach.</p>",
        "feedbackMisconception": "If an anomalous result occurs, it must be frozen, quarantined, and processed through a formal root-cause investigation. Data cannot be erased or obscured; corrections must be fully traceable back to an authorised person.",
        "cards": [
          {
            "id": 501,
            "title": "Overwriting Raw Records",
            "front": "If an analyst uncovers an anomalous result, they can immediately log into the database and overwrite the raw record if the next run is compliant.",
            "isDistractor": true
          },
          {
            "id": 502,
            "title": "Digital Signatures",
            "front": "Every action, input, and alteration within an accredited database is recorded via a permanent, time-stamped digital signature.",
            "isDistractor": false
          },
          {
            "id": 503,
            "title": "Traceable Corrections",
            "front": "If data must be corrected, the original entry cannot be erased; the change must be fully traceable back to an authorised person.",
            "isDistractor": false
          }
        ]
      },
      {
        "id": 6,
        "title": "Physical vs. Digital Dependencies",
        "instruction": "<strong style='color:#e53e3e; text-transform: uppercase;'>Odd One Out:</strong> Two of these statements correctly outline physical-digital dependencies. Identify the <strong>one incorrect statement</strong> that contains a major misconception.",
        "watermark": "number",
        "feedbackCorrect": "<p><strong>Correct! You identified the misconception.</strong></p><p>A digital database entry is completely useless if the physical instrument that generated the data was operating outside its calibrated boundary limits. The digital chain is not secure if the physical execution is flawed.</p>",
        "feedbackIncorrect": "<p><strong>Incorrect. That statement correctly outlines the critical dependency between physical instruments and digital data.</strong></p><p>Digital systems are only as reliable as the physical tools feeding them, and physical maintenance logs must match digital timestamps. The flawed statement incorrectly assumed digital data remains legally defensible even if physical instruments are uncalibrated.</p>",
        "feedbackMisconception": "If the physical calibration layer breaks (e.g., unrecorded optical drift or uncertified flowmeters), the data entering the LIMS is fundamentally corrupted, destroying the legal validity of the testing certificates regardless of how secure the database software is.",
        "cards": [
          {
            "id": 601,
            "title": "Digital Immunity",
            "front": "Because a LIMS handles data electronically, the digital chain of custody remains legally defensible even if physical instruments are uncalibrated.",
            "isDistractor": true
          },
          {
            "id": 602,
            "title": "Physical Dependencies",
            "front": "Your digital data system is only as reliable as the physical instruments feeding it; uncertified equipment corrupts the data entering the LIMS.",
            "isDistractor": false
          },
          {
            "id": 603,
            "title": "Milestone Alignment",
            "front": "A defensible trace requires that physical maintenance milestones align perfectly with your LIMS batch timestamps.",
            "isDistractor": false
          }
        ]
      }
    ];

    class StandaloneOUOApp {
      constructor(containerId, stateData) {
        this.container = document.getElementById(containerId);
        this.data = stateData;
        this.currentIndex = 0;
        this.selectedCardIndex = null;
        this.score = 0;
        this.buildDOM();
        this.renderChallenge(0);
      }
      toRoman(num) {
        const roman = {M:1000, CM:900, D:500, CD:400, C:100, XC:90, L:50, XL:40, X:10, IX:9, V:5, IV:4, I:1};
        let str = '';
        for (let i of Object.keys(roman)) {
          let q = Math.floor(num / roman[i]);
          num -= q * roman[i];
          str += i.repeat(q);
        }
        return str;
      }
      buildDOM() {
        this.container.innerHTML = `
          <div class="ouo-app">
            <div class="ouo-screen" id="quizScreen_${this.container.id}">
              <div class="ouo-intro">
                <p class="ouo-eyebrow" id="eyebrow_${this.container.id}"></p>
                <h1 class="ouo-title" id="title_${this.container.id}"></h1>
                <p class="ouo-text" id="inst_${this.container.id}"></p>
              </div>
              <div class="ouo-grid" id="grid_${this.container.id}"></div>
              <div class="ouo-action">
                <button class="ouo-btn" id="submit_${this.container.id}" disabled>Lock in Selection</button>
              </div>
            </div>

            <div class="ouo-screen ouo-hidden" id="fbScreen_${this.container.id}">
              <div class="ouo-intro">
                <p class="ouo-eyebrow">Detailed Feedback</p>
                <h1 class="ouo-title" id="fbTitle_${this.container.id}">Check results</h1>
              </div>
              <div class="ouo-feedback-panel">
                <div class="ouo-result-title" id="fbStatus_${this.container.id}"></div>
                <div class="ouo-feedback-text" id="fbBody_${this.container.id}"></div>
              </div>
              <div class="ouo-action">
                <button class="ouo-btn" id="next_${this.container.id}"></button>
              </div>
            </div>

            <div class="ouo-screen ouo-hidden" id="endScreen_${this.container.id}">
              <div class="ouo-intro">
                <h1 class="ouo-title">Knowledge Check Complete!</h1>
                <p class="ouo-text" id="score_${this.container.id}" style="font-size:1.3rem; font-weight:600; color:#6221f1;"></p>
              </div>
              <div class="ouo-action">
                <button class="ouo-btn" id="reload_${this.container.id}">Restart Challenges</button>
              </div>
            </div>

            <div class="ouo-loader" id="loader_${this.container.id}">
              <div class="ouo-shuffle">
                <div class="ouo-scard ouo-c1"></div><div class="ouo-scard ouo-c2"></div><div class="ouo-scard ouo-c3"></div>
              </div>
              <div class="ouo-ltext">Evaluating selection...</div>
            </div>
          </div>
        `;

        this.container.querySelector(`#submit_${this.container.id}`).onclick = () => this.submit();
        this.container.querySelector(`#next_${this.container.id}`).onclick = () => this.next();
        this.container.querySelector(`#reload_${this.container.id}`).onclick = () => this.restart();
      }

      renderChallenge(index) {
        if(!this.data || this.data.length === 0) return;
        const quiz = this.data[index];
        this.container.querySelector(`#eyebrow_${this.container.id}`).innerText = `Challenge ${index + 1} of ${this.data.length}`;
        this.container.querySelector(`#title_${this.container.id}`).innerText = quiz.title;
        this.container.querySelector(`#inst_${this.container.id}`).innerHTML = quiz.instruction;

        const grid = this.container.querySelector(`#grid_${this.container.id}`);
        grid.innerHTML = '';
        
        grid.setAttribute('data-total', quiz.cards.length);

        this.selectedCardIndex = null;
        this.container.querySelector(`#submit_${this.container.id}`).disabled = true;

        quiz.cards.forEach((card, idx) => {
          const el = document.createElement('div');
          el.className = 'ouo-card';
          
          let mark = '';
          if(quiz.watermark === 'letter') mark = String.fromCharCode(65 + idx);
          if(quiz.watermark === 'number') mark = String(idx + 1).padStart(2, '0');
          if(quiz.watermark === 'roman') mark = this.toRoman(idx + 1);

          el.innerHTML = `
            <div class="ouo-bg-clip"><div class="ouo-bg-mark">${mark}</div></div>
            <div class="ouo-badge">Selected</div>
            <div class="ouo-content-wrapper">
              <div class="ouo-card-title">${card.title}</div>
              <div class="ouo-card-body">${card.front}</div>
            </div>
          `;

          el.onclick = () => this.selectCard(idx, el);
          grid.appendChild(el);
        });

        window[`appInstance_${this.container.id}`] = this;
      }

      selectCard(idx, el) {
        if(el.classList.contains('is-correct') || el.classList.contains('is-incorrect')) return;
        const all = this.container.querySelectorAll('.ouo-card');
        const subBtn = this.container.querySelector(`#submit_${this.container.id}`);
        
        if(this.selectedCardIndex === idx) {
          this.selectedCardIndex = null;
          el.classList.remove('selected');
          subBtn.disabled = true;
        } else {
          all.forEach(c => c.classList.remove('selected'));
          this.selectedCardIndex = idx;
          el.classList.add('selected');
          subBtn.disabled = false;
        }
      }

      fireConfetti() {
        const colors = ['#6221f1', '#38a169', '#3498db', '#f6ad55', '#e53e3e'];
        for (let i = 0; i < 50; i++) {
          const c = document.createElement('div');
          c.className = 'ouo-confetti';
          c.style.left = Math.random() * 100 + 'vw';
          c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDuration = (Math.random() * 2 + 2) + 's';
          c.style.animationDelay = (Math.random() * 0.5) + 's';
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 4000);
        }
      }

      submit() {
        if(this.selectedCardIndex === null) return;
        const subBtn = this.container.querySelector(`#submit_${this.container.id}`);
        const loader = this.container.querySelector(`#loader_${this.container.id}`);
        subBtn.disabled = true;
        loader.style.display = 'flex';

        setTimeout(() => {
          loader.style.display = 'none';
          
          const quiz = this.data[this.currentIndex];
          const cardsNode = this.container.querySelectorAll('.ouo-card');
          const selectedEl = cardsNode[this.selectedCardIndex];
          
          const correctIndex = quiz.cards.findIndex(c => c.isDistractor);
          const isCorrect = (this.selectedCardIndex === correctIndex);

          if(isCorrect) {
            selectedEl.classList.add('is-correct');
            this.score++;
            this.fireConfetti();
          } else {
            selectedEl.classList.add('is-incorrect');
          }

          setTimeout(() => {
            this.showFeedback(isCorrect, quiz);
            this.transitionScreen(`quizScreen_${this.container.id}`, `fbScreen_${this.container.id}`);
          }, 1600);

        }, 1500);
      }

      showFeedback(isCorrect, quiz) {
        const fbTitle = this.container.querySelector(`#fbTitle_${this.container.id}`);
        const fbStatus = this.container.querySelector(`#fbStatus_${this.container.id}`);
        const fbBody = this.container.querySelector(`#fbBody_${this.container.id}`);
        const nxtBtn = this.container.querySelector(`#next_${this.container.id}`);

        fbTitle.innerText = `${quiz.title} Results`;
        
        let feedbackHTML = "";

        if(isCorrect) {
          fbStatus.innerText = "Correct! You identified the flawed statement.";
          fbStatus.className = "ouo-result-title ouo-correct-col";
          
          feedbackHTML = quiz.feedbackCorrect || "";
          if(quiz.feedbackMisconception && quiz.feedbackMisconception.trim() !== "") {
             feedbackHTML += `
              <div class="misconception-block">
                <div class="misconception-title">Misconception Analysis</div>
                <div style="font-size: 0.95rem; color: #4a5568;">${quiz.feedbackMisconception}</div>
              </div>
             `;
          }

        } else {
          fbStatus.innerText = "Incorrect. Let's review the logic.";
          fbStatus.className = "ouo-result-title ouo-incorrect-col";
          
          const correctCard = quiz.cards.find(c => c.isDistractor);
          feedbackHTML = (quiz.feedbackIncorrect || "") + `
            <div class="correction-block">
              <div class="correction-title">The Flawed Statement</div>
              <div class="correction-card-title">${correctCard.title}</div>
              <div style="font-size: 0.95rem; color: #4a5568;">${correctCard.front}</div>
            </div>
          `;
        }

        fbBody.innerHTML = feedbackHTML;

        if (this.currentIndex === this.data.length - 1) {
          nxtBtn.innerText = "Finish Challenge";
        } else {
          nxtBtn.innerText = "Next Challenge";
        }
      }

      next() {
        if (this.currentIndex < this.data.length - 1) {
          this.currentIndex++;
          this.renderChallenge(this.currentIndex);
          this.transitionScreen(`fbScreen_${this.container.id}`, `quizScreen_${this.container.id}`);
        } else {
          this.container.querySelector(`#score_${this.container.id}`).innerText = `You correctly identified ${this.score} out of ${this.data.length} flawed statements.`;
          this.transitionScreen(`fbScreen_${this.container.id}`, `endScreen_${this.container.id}`);
        }
      }

      restart() {
        this.currentIndex = 0;
        this.score = 0;
        this.renderChallenge(0);
        this.transitionScreen(`endScreen_${this.container.id}`, `quizScreen_${this.container.id}`);
      }

      transitionScreen(outId, inId) {
        const outEl = this.container.querySelector(`#${outId}`);
        const inEl = this.container.querySelector(`#${inId}`);
        outEl.classList.add('roll-out-up');
        setTimeout(() => {
          outEl.classList.add('ouo-hidden');
          outEl.classList.remove('roll-out-up');
          inEl.classList.remove('ouo-hidden');
          inEl.classList.add('roll-in-up');
          setTimeout(() => inEl.classList.remove('roll-in-up'), 600);
        }, 500);
      }
    }

    new StandaloneOUOApp('standalone-root', payloadData);
  </script>
</body>
</html>
